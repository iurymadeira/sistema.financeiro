# Banco de dados para desenvolvimento. Suba com:
#   docker compose --env-file backend/.env up -d
# (o --env-file é o que preenche as ${...} abaixo com os valores do seu backend/.env)
services:
  db:
    image: postgres:16
    container_name: postgres_financeiro
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"   # só acessível da sua máquina
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Interface web leve para olhar as tabelas (substitui o phpMyAdmin): http://localhost:8080
  adminer:
    image: adminer
    container_name: adminer_financeiro
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pg_data:
